
trigger:
- multistage-demo

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build application'
  jobs:
  - job: BuildJob
    displayName: 'Build .NET application'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.0.x'

    - script: dotnet publish MultistageDemo/MultistageDemo.csproj --configuration Release --output $(Build.ArtifactStagingDirectory)/publish
      displayName: 'Publish application'

    - publish: $(Build.ArtifactStagingDirectory)/publish
      artifact: webapp
      displayName: 'Publish build artifact'
    
    - script: dotnet publish AzureFunctions/AzureFunctions.csproj --configuration Release --output $(Build.ArtifactStagingDirectory)/functions
      displayName: 'Publish Azure Functions application'

    - publish: $(Build.ArtifactStagingDirectory)/functions
      artifact: functions
      displayName: 'Publish Azure Functions artifact'


- stage: Dev
  displayName: 'Dev environment'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DevJob
    displayName: 'Deploy to Dev'
    steps:
    - download: current
      artifact: webapp
      displayName: 'Download build artifact'

    - script: |
        echo "Dev environment"
        echo "Build artifact downloaded successfully"
        ls -la $(Pipeline.Workspace)/webapp
      displayName: 'Verify Dev artifact'


- stage: Test
  displayName: 'Test environment'
  dependsOn: Dev
  condition: succeeded()
  jobs:
  - job: TestJob
    displayName: 'Verify application artifact'
    steps:
    - download: current
      artifact: webapp
      displayName: 'Download build artifact'

    - script: |
        echo "Checking application files..."
        test -f "$(Pipeline.Workspace)/webapp/MultistageDemo.dll"
        echo "Application artifact verified successfully!"
      displayName: 'Verify application DLL'


- stage: Staging
  displayName: 'Staging environment'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - deployment: StagingDeployment
    displayName: 'Deploy to Staging'
    environment: 'staging'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: webapp
            displayName: 'Download build artifact'

          - script: |
              echo "Staging environment"
              echo "Checking application files..."
              test -f "$(Pipeline.Workspace)/webapp/MultistageDemo.dll"
              echo "Staging artifact verified successfully!"
            displayName: 'Verify Staging artifact'
