
trigger:
- multistage-demo

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build application'
  jobs:
  - job: BuildJob
    displayName: 'Build .NET application'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.0.x'

    - script: dotnet publish MultistageDemo/MultistageDemo.csproj --configuration Release --output $(Build.ArtifactStagingDirectory)/publish
      displayName: 'Publish application'

    - publish: $(Build.ArtifactStagingDirectory)/publish
      artifact: webapp
      displayName: 'Publish build artifact'
